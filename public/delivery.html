<!DOCTYPE html>
<html lang="es">
<head><script src="/session.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>COME SAYULA - Repartidores</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}

header{
    background:linear-gradient(
        135deg,
        #0077b6,
        #00b4d8
    );
    color:white;
    padding:22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header button{
    border:none;
    background:white;
    color:#0077b6;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px;
}

h2{
    margin-bottom:15px;
}

.seccion{
    margin-bottom:35px;
}

.pedidos{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(330px,1fr));
    gap:20px;
}

.pedido{
    background:white;
    padding:20px;
    border-radius:18px;
    box-shadow:
        0 3px 12px rgba(0,0,0,.08);
}

.pedido h3{
    margin-bottom:10px;
}

.info{
    color:#555;
    line-height:1.6;
    margin-bottom:15px;
}

.items{
    background:#f4f4f4;
    border-radius:10px;
    padding:12px;
    margin-bottom:15px;
}

.item{
    display:flex;
    justify-content:space-between;
    padding:4px 0;
}

.total{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

button.aceptar{
    width:100%;
    border:none;
    padding:13px;
    border-radius:10px;
    background:#0077b6;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button.aceptar:hover{
    background:#005f8f;
}

select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    font-weight:bold;
}

.vacio{
    background:white;
    padding:35px;
    border-radius:15px;
    text-align:center;
    color:#777;
}

.error{
    background:#ffe5e5;
    color:#a00000;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
}

.mapa-entrega{
    height:280px;
    margin-top:14px;
    border-radius:14px;
    overflow:hidden;
    display:none;
    border:1px solid #d7e3ea;
}

.acciones-mapa{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:12px 0;
}

.acciones-mapa button,.acciones-mapa a{
    border:none;
    border-radius:10px;
    padding:12px;
    font-weight:bold;
    text-align:center;
    text-decoration:none;
    cursor:pointer;
}

.compartir{background:#16a34a;color:white;}
.ruta{background:#e8f3f8;color:#006b9c;}
.ubicacion-activa{color:#16713a;font-size:13px;margin-top:8px;}

</style>
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><meta name="theme-color" content="#e85d04"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="COME SAYULA">
<link rel="stylesheet" href="/ai-assistant.css"><link rel="stylesheet" href="/order-chat.css">
</head>

<body><link rel="stylesheet" href="/ui-dialogs.css">

<header>

    <h1>🛵 COME SAYULA</h1>

    <button onclick="cerrarSesion()">
        Cerrar sesión
    </button>

</header>

<div class="container">

    <div id="error"></div>
    <section class="seccion"><h2>Mi perfil de entrega</h2><p id="estadoPerfil">Cargando perfil…</p><form onsubmit="guardarPerfil(event)" style="display:grid;gap:9px"><select id="tipoVehiculo" required><option value="motorcycle">Motocicleta</option><option value="bicycle">Bicicleta</option><option value="car">Automóvil</option><option value="walking">A pie</option></select><input id="descripcionVehiculo" maxlength="120" placeholder="Ejemplo: motocicleta roja" required><button class="aceptar">Guardar vehículo</button></form></section>
    <section class="seccion"><h2>🏆 Mis metas y bonos</h2><div id="resumenIncentivos">Cargando progreso…</div><div id="metasRepartidor" style="display:grid;gap:10px;margin-top:12px"></div><div id="bonosRepartidor" style="margin-top:12px"></div></section>
    <section class="seccion"><h2>Mi disponibilidad</h2><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="aceptar" onclick="cambiarDisponibilidadRepartidor('available')">🟢 Disponible</button><button class="aceptar" style="background:#555" onclick="cambiarDisponibilidadRepartidor('offline')">⚫ Desconectado</button></div><p id="estadoDisponibilidad">Consultando estado…</p></section>
    <section class="seccion"><h2>💵 Mi efectivo y ganancias</h2><div id="cuentaEfectivo">Calculando saldo…</div><form id="formReporteEfectivo" onsubmit="reportarEfectivo(event)" style="display:none;gap:9px;margin-top:12px"><input id="efectivoReportado" type="number" min="0" max="100000" step="0.01" placeholder="Efectivo contado" required><input id="notaEfectivo" maxlength="500" placeholder="Nota opcional"><button class="aceptar">Enviar para conciliación</button></form><div id="historialEfectivo" style="margin-top:12px"></div></section>

    <section class="seccion">

        <h2>
            📦 Pedidos disponibles
        </h2>

        <div
            id="disponibles"
            class="pedidos"
        ></div>

    </section>

    <section class="seccion">

        <h2>
            🛵 Mis entregas
        </h2>

        <div
            id="misPedidos"
            class="pedidos"
        ></div>

    </section>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

let seguimientoActivo=null;
let relojUbicacion=null;
let ultimaUbicacion=null;
let mapaEntrega=null;
let marcadorEntrega=null;
let marcadorDestino=null;
let lineaRuta=null;
let destinoActivo=null;
let ultimaConsultaRuta=0;

function token(){

    return sessionStorage.getItem(
        'cs_token'
    );

}

function usuario(){

    try{

        return JSON.parse(
            sessionStorage.getItem(
                'cs_user'
            ) || 'null'
        );

    }catch(e){

        return null;

    }

}

function comprobarAcceso(){

    const t = token();
    const u = usuario();

    if(!t || !u){

        location.href='/home3.html';

        return false;

    }

    if(u.role !== 'delivery'){

        alert(
            '⛔ Esta sección es únicamente para repartidores.'
        );

        location.href='/home3.html';

        return false;

    }

    return true;

}

async function cargar(){

    try{

        await Promise.all([
            cargarDisponibles(),
            cargarMisPedidos()
        ]);

    }catch(error){

        mostrarError(error.message);

    }

}

async function cargarDisponibles(){

    const respuesta = await fetch(
        '/api/delivery/orders/available',
        {
            headers:{
                'Authorization':
                    'Bearer ' + token()
            }
        }
    );

    const datos =
        await respuesta.json();

    if(!respuesta.ok){

        throw new Error(
            datos.error ||
            'No se pudieron cargar los pedidos.'
        );

    }

    const contenedor =
        document.getElementById(
            'disponibles'
        );

    const pedidos=Array.isArray(datos)?datos:(datos.orders||[]);

    if(!pedidos.length){

        contenedor.innerHTML = `
            <div class="vacio">
                📭 No hay pedidos disponibles.
            </div>
        `;

        return;

    }

    contenedor.innerHTML =
        pedidos.map(p => `

        <div class="pedido">

            <h3>
                📦 Pedido #${p.id}
            </h3>

            <div class="info">

                🍽️ <strong>
                    ${escapar(
                        p.restaurant_name
                    )}
                </strong>

                <br>

                📍 Restaurante:
                ${escapar(
                    p.restaurant_address ||
                    'Sin dirección'
                )}

                <br>

                🔒 La dirección exacta y los datos del cliente se mostrarán únicamente si aceptas el pedido.

                ${p.distance_to_restaurant_km==null?'':'<br>📏 A '+Number(p.distance_to_restaurant_km).toFixed(1)+' km del restaurante'}

            </div>

            <div class="items">

                ${
                    (p.items || []).map(i => `

                    <div class="item">

                        <span>
                            ${i.quantity} ×
                            ${escapar(
                                i.product_name
                            )}
                        </span>

                        <strong>
                            $${(
                                Number(i.unit_price) *
                                Number(i.quantity)
                            ).toFixed(2)}
                        </strong>

                    </div>

                    `).join('')
                }

            </div>

            <div class="total">
                Total:
                $${Number(p.total).toFixed(2)}
            </div>

            <button
                class="aceptar"
                onclick="aceptarPedido(${p.id})"
            >
                🛵 Aceptar pedido
            </button>
            <button class="aceptar" style="background:#666" onclick="rechazarPedido(${p.id})">No puedo tomarlo</button>

        </div>

    `).join('');

}

async function aceptarPedido(id){

    if(!await csConfirm(
        '¿Quieres aceptar el pedido #' +
        id +
        '?'
    )){

        return;

    }

    try{

        const respuesta =
            await fetch(
                '/api/delivery/orders/' +
                id +
                '/accept',
                {
                    method:'POST',

                    headers:{
                        'Authorization':
                            'Bearer ' + token()
                    }
                }
            );

        const datos =
            await respuesta.json();

        if(!respuesta.ok){

            throw new Error(
                datos.error ||
                'No se pudo aceptar el pedido.'
            );

        }

        seguimientoActivo=id;
        if(ultimaUbicacion)enviarUbicacion(id,{coords:ultimaUbicacion});

        alert(
            '✅ Pedido #' +
            id +
            ' aceptado correctamente.'
        );

        cargar();

    }catch(error){

        alert(
            '❌ ' +
            error.message
        );

        cargar();

    }

}

async function cargarMisPedidos(){

    const respuesta =
        await fetch(
            '/api/delivery/orders/my',
            {
                headers:{
                    'Authorization':
                        'Bearer ' + token()
                }
            }
        );

    const datos =
        await respuesta.json();

    if(!respuesta.ok){

        throw new Error(
            datos.error ||
            'No se pudieron cargar tus entregas.'
        );

    }

    const contenedor =
        document.getElementById(
            'misPedidos'
        );

    if(!datos.length){

        contenedor.innerHTML = `
            <div class="vacio">
                🛵 Todavía no tienes entregas.
            </div>
        `;

        return;

    }

    contenedor.innerHTML =
        datos.map(p => `

        <div class="pedido">

            <h3>
                📦 Pedido #${p.id}
            </h3>

            <div class="info">

                🍽️ Restaurante:
                ${escapar(
                    p.restaurant_name
                )}

                <br>

                📍 Recoger en:
                ${escapar(
                    p.restaurant_address ||
                    'Sin dirección'
                )}

                <br>

                🏠 Entregar en:
                ${escapar(
                    p.address
                )}

                <br>

                👤 Cliente:
                ${escapar(
                    p.customer_name
                )}

                <br>

                📞 ${escapar(
                    p.customer_phone ||
                    'Sin teléfono'
                )}

            </div>

            <div class="total">
                $${Number(
                    p.total
                ).toFixed(2)}
            </div>

            ${Number(p.tip_amount)>0?`<div style="margin-top:9px;background:#fff4df;color:#8a4b00;border-radius:10px;padding:10px;text-align:center;font-weight:bold">💛 Propina para el repartidor: $${Number(p.tip_amount).toFixed(2)}<br><small>Entrega directa en efectivo</small></div>`:''}
            <button class="cs-chat-button" onclick="openOrderChat(${p.id},'customer_delivery')">💬 Chat con cliente</button>

            ${p.status === 'delivering' ? `
                <div class="acciones-mapa">
                    <button class="compartir" disabled style="opacity:.9">
                        🟢 Ubicación automática
                    </button>
                    <button class="ruta" onclick="mostrarRutaInterna(${p.id},${p.delivery_latitude==null?'null':Number(p.delivery_latitude)},${p.delivery_longitude==null?'null':Number(p.delivery_longitude)})">🧭 Ver ruta aquí</button>
                </div>
                <div id="estadoUbicacion-${p.id}" class="ubicacion-activa"></div>
                <div id="mapaEntrega-${p.id}" class="mapa-entrega"></div>
                <div id="indicaciones-${p.id}" style="display:none;background:#f7f7f7;border-radius:12px;padding:13px;margin-top:10px;line-height:1.5"></div>
            ` : ''}

         ${
    p.status === 'delivered'

    ? `
        <div style="
            background:#e8f5e9;
            color:#1b5e20;
            padding:14px;
            border-radius:10px;
            text-align:center;
            font-weight:bold;
            margin-top:10px;
        ">
            🔒 Pedido entregado
            <br>
            <small>
                Este pedido ya no puede modificarse.
            </small>
        </div>
    `

    : p.status === 'assigned'
      ? `<button class="aceptar" onclick="cambiarEstado(${p.id},'delivering')">📦 Confirmar que recogí el pedido</button>`
      : `<button class="aceptar" style="background:#16a34a" onclick="cambiarEstado(${p.id},'delivered','${p.delivery_method||'contact'}')">✅ ${p.delivery_method==='no_contact'?'Confirmar con fotografía':'Confirmar entrega con PIN'}</button>`
}   
        </div>

    `).join('');

    if(seguimientoActivo && ultimaUbicacion){
        mostrarMapaRepartidor(seguimientoActivo,ultimaUbicacion);
        if(destinoActivo)dibujarRuta(ultimaUbicacion,destinoActivo,false);
    }

    const entregaEnCurso=datos.find(p=>p.delivery_status==='accepted'&&['assigned','delivering'].includes(p.status));
    if(entregaEnCurso&&!seguimientoActivo)seguimientoActivo=entregaEnCurso.id;

}

async function cambiarDisponibilidadRepartidor(status){try{const r=await fetch('/api/delivery/availability',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token()},body:JSON.stringify({status})}),d=await r.json();if(!r.ok)throw new Error(d.error||'No fue posible cambiar el estado');estadoDisponibilidad.textContent=status==='available'?'🟢 Estás disponible para recibir pedidos':'⚫ Estás desconectado';cargar()}catch(e){alert('❌ '+e.message)}}
async function cargarDisponibilidadRepartidor(){try{const r=await fetch('/api/delivery/availability',{headers:{Authorization:'Bearer '+token()}}),d=await r.json();estadoDisponibilidad.textContent=d.status==='available'?'🟢 Estás disponible para recibir pedidos':d.status==='busy'?'🟠 Estás ocupado con una entrega':'⚫ Estás desconectado'}catch(e){}}
async function cargarPerfil(){try{const r=await fetch('/api/delivery/profile',{headers:{Authorization:'Bearer '+token()}}),d=await r.json();if(!r.ok)throw new Error(d.error);tipoVehiculo.value=d.vehicle_type||'motorcycle';descripcionVehiculo.value=d.vehicle_description||'';estadoPerfil.textContent=(d.verification_status==='verified'?'✅ Perfil verificado':'⏳ Perfil '+(d.verification_status||'pendiente'))+' · '+(d.internal_number||'Sin número')+' · máximo '+Number(d.max_active_orders||1)+' entrega(s) activa(s)'}catch(e){estadoPerfil.textContent='❌ '+e.message}}
async function guardarPerfil(event){event.preventDefault();try{const r=await fetch('/api/delivery/profile',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({vehicleType:tipoVehiculo.value,vehicleDescription:descripcionVehiculo.value})}),d=await r.json();if(!r.ok)throw new Error(d.error);await cargarPerfil();alert('✅ Perfil actualizado')}catch(e){alert('❌ '+e.message)}}
async function cargarCuentaEfectivo(){try{const r=await fetch('/api/delivery/cash-account',{headers:{Authorization:'Bearer '+token()}}),d=await r.json();if(!r.ok)throw new Error(d.error);const p=d.pending||{},money=n=>'$'+Number(n||0).toFixed(2);cuentaEfectivo.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px"><div><small>Efectivo cobrado</small><h3>${money(p.cash_collected)}</h3></div><div><small>Ganancia por envíos</small><h3>${money(p.courier_earnings)}</h3></div><div><small>Propinas registradas</small><h3>${money(d.tips)}</h3></div><div><small>Saldo a entregar</small><h3>${money(p.amount_to_remit)}</h3></div></div>`;formReporteEfectivo.style.display=Number(p.amount_to_remit)>0&&!d.settlements.some(s=>s.status==='review')?'grid':'none';efectivoReportado.value=Number(p.amount_to_remit||0).toFixed(2);historialEfectivo.innerHTML=(d.settlements||[]).map(s=>`<div style="padding:10px;border-top:1px solid #eee"><strong>${s.status==='settled'?'✅ Conciliado':'⏳ En revisión'} · ${money(s.reported_amount)}</strong><br><small>Esperado ${money(s.expected_amount)} · diferencia ${money(s.difference_amount)}${s.reference?' · '+escapar(s.reference):''}</small></div>`).join('')||'<small>Todavía no hay conciliaciones.</small>'}catch(e){cuentaEfectivo.textContent='❌ '+e.message}}
async function cargarIncentivos(){try{const r=await fetch('/api/delivery/incentives',{headers:{Authorization:'Bearer '+token()}}),d=await r.json();if(!r.ok)throw new Error(d.error);const money=n=>'$'+Number(n||0).toFixed(2);resumenIncentivos.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px"><div><small>Nivel</small><h3>${escapar(d.level.name)}</h3></div><div><small>Entregas válidas</small><h3>${d.level.deliveries}</h3></div><div><small>Racha actual</small><h3>🔥 ${d.streak.current_days} día(s)</h3></div><div><small>Bonos por pagar</small><h3>${money(d.summary.pending)}</h3></div></div>${d.level.nextAt?`<small>Te faltan ${Math.max(0,d.level.nextAt-d.level.deliveries)} entregas para el siguiente nivel.</small>`:'<small>Alcanzaste el nivel más alto disponible.</small>'}`;metasRepartidor.innerHTML=d.goals.length?d.goals.map(g=>{const progress=Math.min(100,Math.round(Number(g.progress)/Number(g.target_deliveries)*100));return `<article style="padding:12px;border:1px solid #eadfd6;border-radius:12px"><strong>${escapar(g.name)} · bono ${money(g.bonus_amount)}</strong><p>${g.progress}/${g.target_deliveries} entregas · ${g.period_type==='daily'?'meta diaria':'meta semanal'}</p><div style="height:9px;background:#eee;border-radius:9px"><div style="height:100%;width:${progress}%;background:#e85d04;border-radius:9px"></div></div>${g.completed_at?'<small>✅ Completada</small>':''}</article>`}).join(''):'<small>No hay metas activas en este momento.</small>';bonosRepartidor.innerHTML='<h3>Historial de bonos</h3>'+((d.rewards||[]).map(w=>`<p><strong>${w.status==='paid'?'✅ Pagado':'⏳ Ganado'} · ${money(w.amount)}</strong><br><small>${escapar(w.reason)}${w.reference?' · referencia '+escapar(w.reference):''}</small></p>`).join('')||'<small>Todavía no tienes bonos.</small>')}catch(e){resumenIncentivos.textContent='❌ '+e.message}}
async function reportarEfectivo(event){event.preventDefault();if(!confirm('¿Confirmas que contaste físicamente esta cantidad?'))return;try{const r=await fetch('/api/delivery/cash-settlements',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({reportedAmount:Number(efectivoReportado.value),note:notaEfectivo.value})}),d=await r.json();if(!r.ok)throw new Error(d.error);alert(d.differenceAmount===0?'✅ Reporte enviado sin diferencia.':'⚠️ Reporte enviado con diferencia para revisión.');await cargarCuentaEfectivo()}catch(e){alert('❌ '+e.message)}}
async function rechazarPedido(id){try{await fetch('/api/delivery/orders/'+id+'/reject',{method:'POST',headers:{Authorization:'Bearer '+token()}});cargar()}catch(e){}}

function compartirUbicacion(orderId){
    if(!navigator.geolocation){
        alert('Este dispositivo no permite obtener la ubicación.');
        return;
    }

    seguimientoActivo=orderId;
    const estado=document.getElementById('estadoUbicacion-'+orderId);
    if(estado) estado.textContent='Solicitando permiso de ubicación…';

    if(ultimaUbicacion)enviarUbicacion(orderId,{coords:ultimaUbicacion});
}

function iniciarUbicacionPermanente(){
    if(!navigator.geolocation)return;
    if(relojUbicacion!==null)return;
    relojUbicacion=navigator.geolocation.watchPosition(async posicion=>{
        ultimaUbicacion={latitude:posicion.coords.latitude,longitude:posicion.coords.longitude,accuracy:posicion.coords.accuracy};
        try{await fetch('/api/delivery/location',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token()},body:JSON.stringify(ultimaUbicacion)});}catch(error){}
        if(seguimientoActivo)enviarUbicacion(seguimientoActivo,posicion);
    },error=>{
        const mensaje=error.code===1?'Permite la ubicación para recibir pedidos cercanos.':'No fue posible actualizar tu ubicación.';
        document.getElementById('error').innerHTML='<div class="error">📍 '+mensaje+'</div>';
    },{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
}

async function enviarUbicacion(orderId,posicion){
    ultimaUbicacion={
        latitude:posicion.coords.latitude,
        longitude:posicion.coords.longitude,
        accuracy:posicion.coords.accuracy
    };

    try{
        const respuesta=await fetch('/api/delivery/orders/'+orderId+'/location',{
            method:'PATCH',
            headers:{
                'Content-Type':'application/json',
                'Authorization':'Bearer '+token()
            },
            body:JSON.stringify(ultimaUbicacion)
        });
        const datos=await respuesta.json();
        if(!respuesta.ok) throw new Error(datos.error||'No se pudo compartir la ubicación.');

        const estado=document.getElementById('estadoUbicacion-'+orderId);
        if(estado) estado.textContent='🟢 Ubicación compartida con el cliente';
        mostrarMapaRepartidor(orderId,ultimaUbicacion);
        if(destinoActivo)dibujarRuta(ultimaUbicacion,destinoActivo,false);
    }catch(error){
        const estado=document.getElementById('estadoUbicacion-'+orderId);
        if(estado) estado.textContent='⚠️ '+error.message;
    }
}

function mostrarMapaRepartidor(orderId,ubicacion){
    const contenedor=document.getElementById('mapaEntrega-'+orderId);
    if(!contenedor||typeof L==='undefined') return;
    contenedor.style.display='block';

    if(!mapaEntrega||mapaEntrega.getContainer()!==contenedor){
        mapaEntrega=L.map(contenedor).setView([ubicacion.latitude,ubicacion.longitude],16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
            maxZoom:19,
            attribution:'© OpenStreetMap'
        }).addTo(mapaEntrega);
        marcadorEntrega=L.marker([ubicacion.latitude,ubicacion.longitude])
            .addTo(mapaEntrega).bindPopup('Tu ubicación actual').openPopup();
    }else{
        marcadorEntrega.setLatLng([ubicacion.latitude,ubicacion.longitude]);
        mapaEntrega.setView([ubicacion.latitude,ubicacion.longitude]);
    }
    setTimeout(()=>mapaEntrega.invalidateSize(),50);
}

function mostrarRutaInterna(orderId,latitudDestino,longitudDestino){
    if(latitudDestino===null||longitudDestino===null||!Number.isFinite(latitudDestino)||!Number.isFinite(longitudDestino)){
        alert('Este pedido no tiene una ubicación de entrega válida.');return;
    }
    destinoActivo={latitude:latitudDestino,longitude:longitudDestino};
    if(!ultimaUbicacion){
        compartirUbicacion(orderId);
        const estado=document.getElementById('estadoUbicacion-'+orderId);
        if(estado)estado.textContent='Obteniendo tu ubicación para calcular la ruta…';
        return;
    }
    mostrarMapaRepartidor(orderId,ultimaUbicacion);
    dibujarRuta(ultimaUbicacion,destinoActivo,true);
}

async function dibujarRuta(origen,destino,forzar=false){
    if(!mapaEntrega)return;
    if(!forzar&&lineaRuta&&Date.now()-ultimaConsultaRuta<20000)return;
    ultimaConsultaRuta=Date.now();
    if(marcadorDestino)marcadorDestino.remove();
    marcadorDestino=L.marker([destino.latitude,destino.longitude]).addTo(mapaEntrega).bindPopup('🏠 Entrega');
    if(lineaRuta)lineaRuta.remove();
    const indicaciones=document.getElementById('indicaciones-'+seguimientoActivo);
    try{
        const url=`https://router.project-osrm.org/route/v1/driving/${origen.longitude},${origen.latitude};${destino.longitude},${destino.latitude}?overview=full&geometries=geojson&steps=true`;
        const respuesta=await fetch(url);const datos=await respuesta.json();
        if(!respuesta.ok||!datos.routes?.[0])throw new Error('No se encontró una ruta vial');
        const ruta=datos.routes[0];
        const puntos=ruta.geometry.coordinates.map(punto=>[punto[1],punto[0]]);
        lineaRuta=L.polyline(puntos,{color:'#e85d04',weight:6,opacity:.88}).addTo(mapaEntrega);
        mapaEntrega.fitBounds(lineaRuta.getBounds(),{padding:[25,25]});
        const km=(ruta.distance/1000).toFixed(1),minutos=Math.max(1,Math.round(ruta.duration/60));
        const estado=document.getElementById('estadoUbicacion-'+seguimientoActivo);
        if(estado)estado.textContent=`🧭 Ruta por calles · ${km} km · ${minutos} min aprox.`;
        const pasos=ruta.legs.flatMap(leg=>leg.steps).filter(paso=>paso.name).slice(0,6);
        if(indicaciones){indicaciones.style.display='block';indicaciones.innerHTML='<strong>Próximas calles</strong>'+pasos.map((paso,i)=>`<div style="margin-top:6px">${i+1}. ${textoManiobra(paso.maneuver?.type)} <strong>${escapar(paso.name)}</strong></div>`).join('');}
    }catch(error){
        lineaRuta=L.polyline([[origen.latitude,origen.longitude],[destino.latitude,destino.longitude]],{color:'#e85d04',weight:4,dashArray:'8 8'}).addTo(mapaEntrega);
        mapaEntrega.fitBounds(lineaRuta.getBounds(),{padding:[25,25]});
        if(indicaciones){indicaciones.style.display='block';indicaciones.textContent='⚠️ No fue posible calcular las calles. Se muestra la dirección aproximada.';}
    }
}

function textoManiobra(tipo){return tipo==='depart'?'Inicia por':tipo==='arrive'?'Llega por':tipo==='turn'?'Continúa por':tipo==='roundabout'?'Toma la glorieta hacia':'Sigue por';}

async function cambiarEstado(
    id,
    estado,
    deliveryMethod='contact'
){

    try{
        let deliveryPin='';
        let proofDataUrl='';
        if(estado==='delivered'&&deliveryMethod==='no_contact'){
            const input=document.createElement('input');input.type='file';input.accept='image/png,image/jpeg,image/webp';input.capture='environment';
            proofDataUrl=await new Promise((resolve,reject)=>{input.onchange=()=>{const file=input.files[0];if(!file)return reject(new Error('Selecciona una fotografía de la entrega.'));if(file.size>4*1024*1024)return reject(new Error('La fotografía pesa más de 4 MB.'));const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('No fue posible leer la fotografía.'));reader.readAsDataURL(file)};input.click()});
        }else if(estado==='delivered'){
            deliveryPin=String(prompt('Pide al cliente su código de entrega de 4 dígitos:')||'').trim();
            if(!/^\d{4}$/.test(deliveryPin))throw new Error('Escribe los 4 dígitos del código de entrega.');
        }

        const respuesta =
            await fetch(
                '/api/delivery/orders/' +
                id,
                {
                    method:'PATCH',

                    headers:{
                        'Content-Type':
                            'application/json',

                        'Authorization':
                            'Bearer ' + token()
                    },

                    body:JSON.stringify({
                        status:estado,deliveryPin,proofDataUrl
                    })
                }
            );

        const datos =
            await respuesta.json();

        if(!respuesta.ok){

            throw new Error(
                datos.error ||
                'No se pudo actualizar.'
            );

        }

        if(estado==='delivered'&&seguimientoActivo===id){
            seguimientoActivo=null;
        }

        cargar();

    }catch(error){

        alert(
            '❌ ' +
            error.message
        );

        cargar();

    }

}

function escapar(valor){

    return String(
        valor ?? ''
    )
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}

function mostrarError(mensaje){

    document.getElementById(
        'error'
    ).innerHTML = `
        <div class="error">
            ❌ ${escapar(mensaje)}
        </div>
    `;

}
