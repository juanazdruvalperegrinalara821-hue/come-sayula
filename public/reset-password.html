<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restablecer contraseña · COME SAYULA</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff8f1;color:#30251f;font-family:Arial,sans-serif;padding:20px}main{width:min(430px,100%);background:#fff;border:1px solid #eadfd6;border-radius:20px;padding:28px;box-shadow:0 14px 40px #48230718}input,button{width:100%;font:inherit;padding:13px;border-radius:11px;margin-top:10px}input{border:1px solid #d8cbc2}button{border:0;background:#e85d04;color:#fff;font-weight:bold;cursor:pointer}.mensaje{margin-top:12px;padding:11px;border-radius:10px}.error{background:#ffe7e7;color:#991b1b}.ok{background:#e8f7ed;color:#176b37}a{color:#a84405}</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#e85d04"></head><body><main><h1>Nueva contraseña</h1><p>Escribe una contraseña nueva de al menos 10 caracteres. El enlace sólo puede utilizarse una vez y vence después de 30 minutos.</p><form onsubmit="restablecer(event)"><input id="password" type="password" minlength="10" autocomplete="new-password" placeholder="Nueva contraseña" required><input id="confirmation" type="password" minlength="10" autocomplete="new-password" placeholder="Confirma la contraseña" required><button>Cambiar contraseña</button></form><div id="mensaje"></div><p><a href="/auth.html">Volver al inicio de sesión</a></p></main><script>const token=new URLSearchParams(location.search).get('token')||'';if(!token)mensaje.innerHTML='<div class="mensaje error">El enlace está incompleto. Solicita uno nuevo desde el inicio de sesión.</div>';async function restablecer(event){event.preventDefault();if(!token)return;if(password.value!==confirmation.value){mensaje.innerHTML='<div class="mensaje error">Las contraseñas no coinciden.</div>';return}try{const response=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:password.value})}),data=await response.json();if(!response.ok)throw new Error(data.error||'No fue posible cambiar la contraseña');event.target.reset();mensaje.innerHTML='<div class="mensaje ok">Contraseña actualizada. Tus sesiones anteriores fueron cerradas. Ya puedes iniciar sesión.</div>'}catch(error){mensaje.innerHTML='<div class="mensaje error">'+String(error.message).replace(/[&<>]/g,'')+'</div>'}}</script><script src="/pwa-install.js" defer></script></body></html>
