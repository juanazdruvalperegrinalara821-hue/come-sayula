<!doctype html><html lang="es"><head><script src="/session.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido grupal · COME SAYULA</title><link rel="manifest" href="/manifest.webmanifest"><style>body{margin:0;font:16px Arial;background:#fff8f1;color:#28211d}main{max-width:900px;margin:auto;padding:20px}header{background:#e85d04;color:#fff;padding:22px}.card{background:#fff;border:1px solid #eadfd6;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}input,select,button{padding:11px;border:1px solid #d8cec6;border-radius:10px;font:inherit}button{background:#e85d04;color:#fff;border:0;font-weight:bold;cursor:pointer}.product{display:flex;flex-direction:column;gap:8px}.item{padding:10px;border-bottom:1px solid #eee}.muted{color:#666;font-size:13px}</style></head><body><header><a href="/home3.html" style="color:#fff">← Volver</a><h1>👥 Pedido grupal</h1><p>Cada persona agrega lo suyo; quien crea el grupo confirma el pedido.</p></header><main><section id="create" class="card"><h2>Crear grupo</h2><select id="restaurant"><option>Cargando restaurantes…</option></select> <button onclick="createGroup()">Crear enlace</button></section><section id="group" hidden><div class="card"><h2 id="title"></h2><p id="share"></p><button onclick="copyLink()">Copiar enlace para invitar</button><p class="muted">El grupo vence en 24 horas. Precios y disponibilidad se validan nuevamente al confirmar.</p></div><div class="card"><h2>Menú</h2><div id="products" class="grid"></div></div><div class="card"><h2>Productos del grupo</h2><div id="items"></div><button id="complete" hidden onclick="completeGroup()">Pasar todo al carrito y confirmar</button></div></section></main><script>const token=sessionStorage.getItem('cs_token');if(!token)location.href='/auth.html';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),code=new URLSearchParams(location.search).get('code');let state=null;const api=async(url,options={})=>{const r=await fetch(url,{...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),Authorization:'Bearer '+token,...options.headers}}),d=await r.json();if(!r.ok)throw new Error(d.error);return d};async function init(){try{if(code)return loadGroup();const list=await api('/api/group-orders/restaurants');restaurant.innerHTML=list.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}catch(e){alert('❌ '+e.message)}}async function createGroup(){try{const d=await api('/api/group-orders',{method:'POST',body:JSON.stringify({restaurantId:Number(restaurant.value)})});location.href=d.url}catch(e){alert('❌ '+e.message)}}async function loadGroup(){try{state=await api('/api/group-orders/'+encodeURIComponent(code));create.hidden=true;group.hidden=false;title.textContent='Grupo para '+state.restaurantName;share.textContent=location.href;products.innerHTML=state.status==='open'?state.products.map(p=>`<article class="card product"><strong>${esc(p.name)}</strong><span>$${Number(p.price).toFixed(2)}</span>${p.variants.length?`<select id="v-${p.id}">${p.variants.map(v=>`<option>${esc(v.name)}</option>`).join('')}</select>`:''}${p.addons.length?`<select id="a-${p.id}" multiple>${p.addons.map(a=>`<option>${esc(a.name)}</option>`).join('')}</select><small class="muted">Mantén pulsado para elegir varios complementos.</small>`:''}<input id="q-${p.id}" type="number" min="1" max="20" value="1"><button onclick="addItem(${p.id})">Agregar lo mío</button></article>`).join(''):'<p>Este grupo ya está cerrado.</p>';items.innerHTML=state.items.length?state.items.map(i=>`<div class="item"><strong>${esc(i.participant_name)}</strong>: ${i.quantity} × ${esc(i.product_name)} ${i.variant?'· '+esc(i.variant):''} ${i.canRemove&&state.status==='open'?`<button onclick="removeItem(${i.id})">Quitar</button>`:''}</div>`).join(''):'<p>Aún no agregan productos.</p>';complete.hidden=!(state.isCreator&&state.status==='open')}catch(e){alert('❌ '+e.message)}}async function addItem(id){try{const addons=[...document.getElementById('a-'+id)?.selectedOptions||[]].map(x=>x.value);await api('/api/group-orders/'+code+'/items',{method:'POST',body:JSON.stringify({productId:id,quantity:Number(document.getElementById('q-'+id).value),variant:document.getElementById('v-'+id)?.value||'',addons})});loadGroup()}catch(e){alert('❌ '+e.message)}}async function removeItem(id){try{await api('/api/group-orders/'+code+'/items/'+id,{method:'DELETE'});loadGroup()}catch(e){alert('❌ '+e.message)}}function copyLink(){navigator.clipboard?.writeText(location.href);alert('✅ Enlace copiado')}async function completeGroup(){try{const d=await api('/api/group-orders/'+code+'/complete',{method:'POST'});localStorage.setItem('come_sayula_carrito',JSON.stringify(d.items));location.href='/home3.html?openCart=1'}catch(e){alert('❌ '+e.message)}}init()</script><script src="/pwa-install.js" defer></script></body></html>
