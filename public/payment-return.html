<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmando pago - COME SAYULA</title><meta name="theme-color" content="#e85d04"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff7f0;font-family:Arial,sans-serif;color:#35251d;padding:20px}.card{max-width:520px;background:#fff;border:1px solid #f0d9c7;border-radius:22px;padding:32px;text-align:center;box-shadow:0 12px 35px #693b1718}.icon{font-size:58px}button{border:0;border-radius:12px;padding:13px 18px;background:#e85d04;color:#fff;font-weight:bold;cursor:pointer;width:100%;margin-top:12px}.secondary{background:#eee;color:#333}</style></head><body><main class="card"><div class="icon" id="icon">⏳</div><h1 id="title">Confirmando el pago</h1><p id="message">COME SAYULA está consultando directamente a Mercado Pago. No cierres esta pantalla.</p><div id="actions"></div></main><script>
const params=new URLSearchParams(location.search),orderId=Number(params.get('order')),paymentId=params.get('payment_id')||params.get('collection_id'),token=sessionStorage.getItem('cs_token');
const show=(icon,title,message)=>{document.getElementById('icon').textContent=icon;document.getElementById('title').textContent=title;document.getElementById('message').textContent=message;document.getElementById('actions').innerHTML=`<button onclick="location.href='/tracking.html?order=${Number.isInteger(orderId)?orderId:''}'">Ver mi pedido</button><button class="secondary" onclick="location.href='/home3.html'">Volver al inicio</button>`};
(async()=>{if(!token){show('🔐','Inicia sesión','Tu sesión no está disponible. Inicia sesión con la cuenta que hizo el pedido para verificar el pago.');return}if(!Number.isInteger(orderId)||orderId<=0||!paymentId){show('ℹ️','Pago pendiente','No recibimos todavía una confirmación verificable. Puedes revisar el pedido e intentar el pago nuevamente.');return}try{const response=await fetch('/api/payments/mercadopago/confirm',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({orderId,paymentId})}),data=await response.json();if(!response.ok)throw new Error(data.error||'El pago todavía no está aprobado');show('✅','Pago confirmado','Mercado Pago confirmó el pago. El restaurante ya recibió tu pedido.')}catch(error){show('⏳','Pago pendiente',error.message+'. Si acabas de pagar, espera un momento y vuelve a revisar el pedido.')}})();
</script></body></html>
