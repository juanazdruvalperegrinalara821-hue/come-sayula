<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · COME SAYULA</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7f9;color:#29231f}header{background:#482307;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}button,input,select{font:inherit}.salir{border:0;border-radius:9px;padding:10px 14px}main{max-width:1100px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #eadfd6;border-radius:18px;padding:20px;margin-bottom:20px;box-shadow:0 8px 24px #3d210b0c}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form input,.form select{padding:12px;border:1px solid #dcd5d0;border-radius:10px}.principal{border:0;border-radius:10px;padding:12px;background:#e85d04;color:#fff;font-weight:bold;cursor:pointer}.cuentas{display:grid;gap:12px}.cuenta{border:1px solid #e6dfda;border-radius:14px;padding:15px;display:flex;justify-content:space-between;gap:14px;align-items:center}.estado{font-weight:bold}.pending{color:#a15c00}.approved{color:#16733b}.suspended{color:#aa2020}.acciones{display:flex;gap:7px;flex-wrap:wrap}.acciones button{border:1px solid #ddd;border-radius:8px;padding:8px;background:#fff;cursor:pointer}.mensaje{padding:11px;margin:10px 0;border-radius:10px}.error{background:#ffe7e7;color:#991b1b}.ok{background:#e8f7ed;color:#176b37}@media(max-width:700px){.form{grid-template-columns:1fr}.cuenta{align-items:stretch;flex-direction:column}}</style><link rel="stylesheet" href="/ai-assistant.css"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><meta name="theme-color" content="#e85d04"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="COME SAYULA"></head>
<body><header><h1>🛡️ Administración</h1><button class="salir" onclick="salir()">Cerrar sesión</button></header><main>
<div id="mensaje"></div><section class="panel"><h2>Crear cuenta operativa</h2><p>El restaurante o repartidor quedará pendiente hasta que lo apruebes.</p><form class="form" onsubmit="crear(event)"><input id="nombre" placeholder="Nombre o restaurante" required maxlength="100"><input id="correo" type="email" placeholder="Correo" required><input id="telefono" placeholder="Teléfono"><input id="password" type="password" minlength="10" placeholder="Contraseña temporal (10 caracteres)" required><select id="rol"><option value="restaurant">Restaurante</option><option value="delivery">Repartidor</option></select><button class="principal">Crear cuenta pendiente</button></form></section>
<section class="panel"><h2>Cuentas de restaurantes y repartidores</h2><div id="cuentas" class="cuentas">Cargando…</div></section></main>
<script>
const token=sessionStorage.getItem('cs_token');let usuario=null;try{usuario=JSON.parse(sessionStorage.getItem('cs_user')||'null')}catch(e){}if(!token||usuario?.role!=='admin')location.href='/auth.html';
const api=async(url,options={})=>{const respuesta=await fetch(url,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...options.headers}});const datos=await respuesta.json();if(!respuesta.ok)throw new Error(datos.error||'No fue posible continuar');return datos};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function cargar(){try{const lista=await api('/api/admin/users');cuentas.innerHTML=lista.length?lista.map(u=>`<article class="cuenta"><div><strong>${u.role==='restaurant'?'🍳':'🛵'} ${esc(u.name)}</strong><br><small>${esc(u.email)} · ${esc(u.phone||'Sin teléfono')}</small><br><span class="estado ${u.account_status}">${u.account_status==='approved'?'Aprobada':u.account_status==='pending'?'Pendiente':'Suspendida'}</span> · correo ${u.email_verified?'verificado':'sin verificar'} · teléfono ${u.phone_verified?'verificado':'sin verificar'}</div><div class="acciones"><button onclick="estado(${u.id},'approved')">Aprobar</button><button onclick="estado(${u.id},'suspended')">Suspender</button><button onclick="verificar(${u.id},${u.email_verified?0:1},${u.phone_verified})">${u.email_verified?'Quitar':'Verificar'} correo</button><button onclick="verificar(${u.id},${u.email_verified},${u.phone_verified?0:1})">${u.phone_verified?'Quitar':'Verificar'} teléfono</button></div></article>`).join(''):'No hay cuentas operativas.'}catch(e){mostrar(e.message,'error')}}
async function crear(e){e.preventDefault();try{await api('/api/admin/users',{method:'POST',body:JSON.stringify({name:nombre.value,email:correo.value,phone:telefono.value,password:password.value,role:rol.value})});e.target.reset();mostrar('Cuenta creada. Ahora puedes revisarla y aprobarla.','ok');cargar()}catch(error){mostrar(error.message,'error')}}
async function estado(id,status){try{await api('/api/admin/users/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});cargar()}catch(e){mostrar(e.message,'error')}}
async function verificar(id,emailVerified,phoneVerified){try{await api('/api/admin/users/'+id+'/verification',{method:'PATCH',body:JSON.stringify({emailVerified,phoneVerified})});cargar()}catch(e){mostrar(e.message,'error')}}
function mostrar(texto,tipo){mensaje.innerHTML=`<div class="mensaje ${tipo}">${esc(texto)}</div>`}function salir(){sessionStorage.clear();location.href='/auth.html'}cargar();
</script><script src="/pwa-install.js" defer></script><script src="/ai-assistant.js" defer></script></body></html>
