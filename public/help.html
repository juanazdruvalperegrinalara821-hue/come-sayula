<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centro de ayuda · COME SAYULA</title><link rel="manifest" href="/manifest.webmanifest"><style>body{margin:0;font:16px Arial;background:#fff8f1;color:#26211d}main{max-width:760px;margin:auto;padding:24px}header{background:linear-gradient(135deg,#e85d04,#f48c06);color:#fff;padding:24px;border-radius:0 0 24px 24px}article{background:#fff;border:1px solid #eadfd6;border-radius:15px;padding:17px;margin:12px 0;box-shadow:0 5px 16px #5d2b0c12}button,a.action{display:inline-block;border:0;border-radius:10px;background:#e85d04;color:#fff;padding:11px 14px;text-decoration:none;font-weight:bold;cursor:pointer}.back{color:#fff}</style></head><body><header><a class="back" href="/home3.html">← Volver</a><h1>🆘 Centro de ayuda</h1><p>Soluciones rápidas y atención ligada a tu pedido.</p></header><main id="topics">Cargando…</main><script>const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/help/topics').then(r=>r.json()).then(items=>topics.innerHTML=items.map(x=>`<article><h2>${esc(x.title)}</h2><p>${esc(x.answer)}</p><a class="action" href="${x.url}">Resolver ahora</a></article>`).join('')+`<article><h2>¿No se resolvió?</h2><p>Crea un reporte ligado al pedido. Administración podrá revisar estados, mensajes y evidencia.</p><a class="action" href="/feedback.html">Reportar problema</a></article>`).catch(()=>topics.textContent='No fue posible cargar la ayuda.')</script><script src="/pwa-install.js" defer></script></body></html>
