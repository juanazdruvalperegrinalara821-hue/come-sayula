<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Seguimiento de pedidos - COME SAYULA</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f7;color:#2f241f}
header{position:sticky;top:0;z-index:500;background:linear-gradient(135deg,#f47b20,#e85d04);color:white;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 15px #0002}
header h1{margin:0;font-size:23px}header button{border:0;background:white;color:#d95100;border-radius:11px;padding:10px 15px;font-weight:bold;cursor:pointer}
.contenedor{max-width:1100px;margin:auto;padding:24px;display:grid;grid-template-columns:360px 1fr;gap:22px}
.panel,.detalle{background:white;border:1px solid #eee2d7;border-radius:20px;box-shadow:0 8px 26px #47281212;padding:20px}
.pedido{border:1px solid #eadfd5;border-radius:14px;padding:14px;margin-top:12px;cursor:pointer;transition:.2s}.pedido:hover,.pedido.activo{border-color:#e85d04;background:#fff8f1;transform:translateY(-1px)}
.fila{display:flex;justify-content:space-between;gap:12px}.estado{display:inline-block;margin-top:9px;border-radius:999px;padding:6px 10px;background:#fff0e5;color:#b94c04;font-size:13px;font-weight:bold}
#mapa{height:430px;border-radius:16px;margin-top:16px;background:#edf1f2}.espera{height:100%;display:grid;place-items:center;text-align:center;color:#777;padding:30px}.datos{line-height:1.7;color:#555}.actualizacion{font-size:13px;color:#16803b;font-weight:bold;margin-top:10px}
.entrega-lista{text-align:center;background:linear-gradient(145deg,#fff8f1,#fff);border:1px solid #f3d8c2;border-radius:18px;padding:24px;margin-top:18px}.entrega-lista .icono{font-size:58px}.resena{margin-top:18px;border-top:1px solid #eee;padding-top:18px}.resena-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.resena label{display:block;font-weight:bold;font-size:13px;margin-bottom:5px}.resena select,.resena input,.resena textarea{width:100%;padding:11px;border:1px solid #d9d1cb;border-radius:10px;font:inherit}.resena textarea{min-height:75px;resize:vertical}.propinas{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}.propinas button{border:1px solid #efc6a8;background:#fff7f0;color:#a44408;border-radius:999px;padding:8px 11px;cursor:pointer}.enviar-resena{width:100%;border:0;border-radius:11px;padding:13px;background:#e85d04;color:#fff;font-weight:bold;cursor:pointer;margin-top:11px}.agradecimiento{background:#eaf8ef;color:#176b37;border-radius:13px;padding:15px;margin-top:16px;text-align:center}
@media(max-width:780px){.contenedor{grid-template-columns:1fr;padding:14px}.panel,.detalle{padding:16px}#mapa{height:360px}}
</style>
<link rel="stylesheet" href="/ai-assistant.css"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><meta name="theme-color" content="#e85d04"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="COME SAYULA">
</head>
<body><link rel="stylesheet" href="/ui-dialogs.css">
<header><h1>📍 Seguimiento de pedidos</h1><button onclick="location.href='/home3.html'">← Inicio</button></header>
<main class="contenedor">
    <section class="panel"><h2>Mis pedidos</h2><div id="pedidos">Cargando…</div></section>
    <section class="detalle" id="detalle"><div class="espera"><div><div style="font-size:54px">🛵</div><h2>Selecciona un pedido</h2><p>Aquí podrás ver el avance de tu entrega.</p></div></div></section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const token=sessionStorage.getItem('cs_token');
const usuario=JSON.parse(sessionStorage.getItem('cs_user')||'null');
let pedidoActivo=null,mapa=null,marcador=null,marcadorDestino=null,lineaRuta=null,temporizador=null;
const nombresEstado={received:'Pedido recibido',accepted:'Aceptado por el restaurante',preparing:'En preparación',ready:'Listo para recoger',assigned:'Repartidor asignado',delivering:'En camino',delivered:'Entregado',cancelled:'Cancelado'};

if(!token||!usuario||usuario.role!=='customer') location.href='/home3.html';

async function api(url){
    const respuesta=await fetch(url,{headers:{Authorization:'Bearer '+token}});
    const datos=await respuesta.json();
    if(!respuesta.ok) throw new Error(datos.error||'No se pudo cargar la información.');
    return datos;
}

async function cargarPedidos(){
    try{
        const pedidos=await api('/api/orders/my');
        const contenedor=document.getElementById('pedidos');
        if(!pedidos.length){contenedor.innerHTML='<div class="espera">Todavía no tienes pedidos.</div>';return;}
        contenedor.innerHTML=pedidos.map(p=>`
            <article class="pedido" id="pedido-${p.id}" onclick="seguir(${p.id})">
                <div class="fila"><strong>Pedido #${p.id}</strong><strong>$${Number(p.total).toFixed(2)}</strong></div>
                <div>${escapar(p.restaurant_name)}</div>
                <span class="estado">${nombresEstado[p.status]||p.status}</span>
            </article>`).join('');
        const solicitado=Number(new URLSearchParams(location.search).get('order'));
        const primero=pedidos.find(p=>p.id===solicitado)||pedidos.find(p=>p.status==='delivering')||pedidos[0];
        seguir(primero.id);
    }catch(error){document.getElementById('pedidos').textContent='❌ '+error.message;}
}

async function seguir(id){
    pedidoActivo=id;
    document.querySelectorAll('.pedido').forEach(e=>e.classList.remove('activo'));
    document.getElementById('pedido-'+id)?.classList.add('activo');
    await actualizarSeguimiento();
    clearInterval(temporizador);
    temporizador=setInterval(actualizarSeguimiento,5000);
}

async function actualizarSeguimiento(){
    if(!pedidoActivo)return;
    try{
        const p=await api('/api/orders/'+pedidoActivo+'/tracking');
        cerrarMapaSeguimiento();
        const tieneUbicacion=p.latitude!==null&&p.latitude!==undefined&&p.longitude!==null&&p.longitude!==undefined&&Number.isFinite(Number(p.latitude))&&Number.isFinite(Number(p.longitude));
        const finalizado=p.status==='delivered'||p.status==='cancelled';
        document.getElementById('detalle').innerHTML=`
            <h2>Pedido #${p.id} · ${nombresEstado[p.status]||p.status}</h2>
            <div class="datos">
                🍽️ <strong>${escapar(p.restaurant_name)}</strong><br>
                🏠 Entrega: ${escapar(p.address)}<br>
                🛵 Repartidor: ${escapar(p.delivery_name||'Aún no asignado')}
                ${p.delivery_phone?'<br>📞 '+escapar(p.delivery_phone):''}
                ${p.delivery_pin?'<div style="margin-top:12px;background:#fff3cd;padding:12px;border-radius:10px"><strong>🔐 Código de entrega: <span style="font-size:24px;letter-spacing:5px">'+p.delivery_pin+'</span></strong><br><small>Díselo al repartidor únicamente cuando recibas tu pedido.</small></div>':''}
            </div>
            <div class="actualizacion">${mensajeUbicacion(p,tieneUbicacion)}</div>
            ${p.status==='received'&&p.responseDeadline?`<div class="actualizacion">⏳ Esperando confirmación del restaurante.</div><button style="display:${Date.now()>=new Date(p.responseDeadline).getTime()?'block':'none'};width:100%;padding:12px;border:0;border-radius:10px;background:#a61b1b;color:white;font-weight:bold" onclick="cancelarSinRespuesta(${p.id})">Cancelar sin penalización</button>`:''}
            ${finalizado?panelFinal(p):`<div id="resumenRuta" class="actualizacion"></div><div id="mapa"><div class="espera">${tieneUbicacion?'Cargando mapa…':'El mapa aparecerá cuando el repartidor comparta su ubicación.'}</div></div>`}`;
        if(!finalizado&&tieneUbicacion) pintarMapa(Number(p.latitude),Number(p.longitude),p.delivery_name,p.delivery_latitude==null?null:Number(p.delivery_latitude),p.delivery_longitude==null?null:Number(p.delivery_longitude));
        if(finalizado){clearInterval(temporizador);temporizador=null;}
    }catch(error){document.getElementById('detalle').innerHTML='<div class="espera">❌ '+escapar(error.message)+'</div>';}
}

function cerrarMapaSeguimiento(){if(mapa){try{mapa.remove()}catch(e){}}mapa=null;marcador=null;marcadorDestino=null;lineaRuta=null;}

function panelFinal(p){
    if(p.status==='cancelled')return '<div class="entrega-lista"><div class="icono">ℹ️</div><h3>Pedido cerrado</h3><p>La ubicación del repartidor ya no está disponible.</p></div>';
    if(p.restaurant_rating)return `<div class="entrega-lista"><div class="icono">✅</div><h3>Entrega finalizada</h3><p>El mapa se cerró para proteger la ubicación del repartidor.</p></div><div class="agradecimiento">Gracias por calificar: restaurante ${p.restaurant_rating}/5${p.delivery_rating?' · repartidor '+p.delivery_rating+'/5':''}${Number(p.tip_amount)>0?' · propina $'+Number(p.tip_amount).toFixed(2):''}.</div>`;
    return `<div class="entrega-lista"><div class="icono">🎉</div><h3>¡Pedido entregado!</h3><p>El seguimiento terminó y la ubicación del repartidor se ocultó.</p></div>
    <form class="resena" onsubmit="enviarResena(event,${p.id})"><h3>Cuéntanos cómo te fue</h3><div class="resena-grid"><div><label>Restaurante</label><select id="calificacionRestaurante" required><option value="">Calificar</option>${[5,4,3,2,1].map(n=>`<option value="${n}">${'★'.repeat(n)} ${n}/5</option>`).join('')}</select></div>${p.delivery_name?`<div><label>Repartidor</label><select id="calificacionRepartidor"><option value="">Sin calificar</option>${[5,4,3,2,1].map(n=>`<option value="${n}">${'★'.repeat(n)} ${n}/5</option>`).join('')}</select></div>`:''}</div><label style="margin-top:12px">Propina para el repartidor</label><div class="propinas"><button type="button" onclick="elegirPropina(0)">Sin propina</button><button type="button" onclick="elegirPropina(10)">$10</button><button type="button" onclick="elegirPropina(20)">$20</button><button type="button" onclick="elegirPropina(30)">$30</button></div><input id="propinaPedido" type="number" min="0" max="1000" step="1" value="0"><small>Se registra para entregarla directamente al repartidor; todavía no es un cobro en línea.</small><label style="margin-top:12px">Comentario opcional</label><textarea id="comentarioResena" maxlength="500" placeholder="¿Qué podemos mejorar?"></textarea><div id="errorResena"></div><button class="enviar-resena">Enviar calificación</button></form>`;
}

function elegirPropina(monto){document.getElementById('propinaPedido').value=monto;}
async function cancelarSinRespuesta(id){if(!await confirm('El restaurante no respondió a tiempo. ¿Deseas cancelar sin penalización?'))return;try{const respuesta=await fetch('/api/orders/'+id+'/cancel-no-response',{method:'POST',headers:{Authorization:'Bearer '+token}}),datos=await respuesta.json();if(!respuesta.ok)throw new Error(datos.error||'No fue posible cancelar');await cargarPedidos()}catch(error){alert('❌ '+error.message)}}
async function enviarResena(event,id){event.preventDefault();const button=event.currentTarget.querySelector('button[type="submit"],.enviar-resena');button.disabled=true;try{const respuesta=await fetch('/api/orders/'+id+'/review',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({restaurantRating:Number(document.getElementById('calificacionRestaurante').value),deliveryRating:document.getElementById('calificacionRepartidor')?.value||null,tipAmount:Number(document.getElementById('propinaPedido').value||0),comment:document.getElementById('comentarioResena').value})});const datos=await respuesta.json();if(!respuesta.ok)throw new Error(datos.error||'No fue posible guardar');await actualizarSeguimiento();await cargarPedidos();}catch(error){document.getElementById('errorResena').textContent='❌ '+error.message;button.disabled=false;}}

function mensajeUbicacion(p,tiene){
    if(p.status==='delivered') return '✅ El pedido ya fue entregado.';
    if(!p.delivery_name) return 'Esperando que un repartidor acepte el pedido.';
    if(!tiene) return 'Esperando la primera ubicación del repartidor…';
    return '🟢 Ubicación actualizada: '+new Date(p.location_updated_at+'Z').toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}

async function pintarMapa(lat,lng,nombre,destinoLat,destinoLng){
    if(typeof L==='undefined')return;
    mapa=L.map('mapa').setView([lat,lng],16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(mapa);
    marcador=L.marker([lat,lng]).addTo(mapa).bindPopup('🛵 '+escapar(nombre||'Repartidor')).openPopup();
    if(destinoLat!==null&&destinoLng!==null&&Number.isFinite(destinoLat)&&Number.isFinite(destinoLng)){
        marcadorDestino=L.marker([destinoLat,destinoLng]).addTo(mapa).bindPopup('🏠 Tu entrega');
        const resumen=document.getElementById('resumenRuta');
        try{
            const url=`https://router.project-osrm.org/route/v1/driving/${lng},${lat};${destinoLng},${destinoLat}?overview=full&geometries=geojson`;
            const respuesta=await fetch(url);
            if(!respuesta.ok)throw new Error('Ruta no disponible');
            const datos=await respuesta.json();
            const ruta=datos.routes&&datos.routes[0];
            if(!ruta)throw new Error('Ruta no encontrada');
            lineaRuta=L.geoJSON(ruta.geometry,{style:{color:'#e85d04',weight:6,opacity:.9}}).addTo(mapa);
            mapa.fitBounds(lineaRuta.getBounds(),{padding:[30,30]});
            if(resumen)resumen.textContent=`🛣️ Distancia restante aproximada: ${(ruta.distance/1000).toFixed(1)} km · ${Math.max(1,Math.round(ruta.duration/60))} min`;
        }catch(error){
            lineaRuta=L.polyline([[lat,lng],[destinoLat,destinoLng]],{color:'#e85d04',weight:5,dashArray:'10 8'}).addTo(mapa);
            mapa.fitBounds(lineaRuta.getBounds(),{padding:[30,30]});
            if(resumen)resumen.textContent='⚠️ No fue posible calcular la ruta por calles; se muestra la dirección aproximada.';
        }
    }
}

function escapar(valor){return String(valor??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
cargarPedidos();
</script>
<script src="/pwa-install.js" defer></script><script src="/notifications.js" defer></script><script src="/ui-dialogs.js" defer></script><script src="/ai-assistant.js" defer></script></body>
</html>
